# iOS derlemesi (fehim1/ios/hazirla.sh "ios" dalına gönderir): şifreli kaynağı açar (anahtar Cloudflare sayacından,
# GitHub'ın imzalı kimlik belgesiyle), programı iPhone ve simülatör için kütüphane olarak derler, Xcode projesini kurar,
# Apple'ın anahtarıyla imzalayıp TestFlight'a yükler; istenirse simülatörden ekran görüntüleri çıkarır.
name: iOS
on:
  push:
    branches: [ios]
permissions:
  contents: write
  id-token: write
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Kaynağı aç
        run: |
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tefsir-sayac" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          KEY=$(curl -sS -f -X POST -H "Authorization: Bearer $TOK" https://tefsir-sayac.tefsirkutuphanesi.workers.dev/ios-anahtar)
          echo "::add-mask::$KEY"
          OSSL=$(brew --prefix openssl@3 2>/dev/null)/bin/openssl; [ -x "$OSSL" ] || OSSL=openssl
          mkdir -p src && "$OSSL" enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "pass:$KEY" -in kaynak.enc | tar xzf - -C src
          ls src
      - name: Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "Xcode 26 bu makinede yok"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes | tail -5
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/program/go.mod
          cache: false
      - name: Program (iPhone ve simülatör)
        working-directory: src/program
        run: |
          set -e
          mkdir -p ../ios/lib/device ../ios/lib/sim ../ios/lib/include
          SDK=$(xcrun --sdk iphoneos --show-sdk-path); CCD=$(xcrun --sdk iphoneos -f clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="$CCD" CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
            go build -buildmode=c-archive -tags uienc -trimpath -ldflags "-s -w" -o ../ios/lib/device/libtefsir.a .
          SDKS=$(xcrun --sdk iphonesimulator --show-sdk-path); CCS=$(xcrun --sdk iphonesimulator -f clang)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="$CCS" CGO_CFLAGS="-isysroot $SDKS -target arm64-apple-ios15.0-simulator" CGO_LDFLAGS="-isysroot $SDKS -target arm64-apple-ios15.0-simulator" \
            go build -buildmode=c-archive -tags uienc -trimpath -ldflags "-s -w" -o ../ios/lib/sim/libtefsir.a .
          cp ../ios/lib/device/libtefsir.h ../ios/lib/include/
          ls -la ../ios/lib/device ../ios/lib/sim
      - name: Xcode projesi
        working-directory: src/ios
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          xcodebuild -version
      - name: Apple anahtarı ve uygulama kimliği
        env:
          KID: ${{ secrets.APPLE_API_KEY_ID }}
          ISS: ${{ secrets.APPLE_API_ISSUER_ID }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/apikey && printf '%s\n' "$P8" > ~/apikey/AuthKey.p8 && chmod 600 ~/apikey/AuthKey.p8
          pip3 install -q --break-system-packages cryptography 2>/dev/null || pip3 install -q cryptography
          python3 - <<'PY' >> $GITHUB_ENV
          import base64, json, os, time, urllib.request
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils
          key = serialization.load_pem_private_key(open(os.path.expanduser('~/apikey/AuthKey.p8'), 'rb').read(), password=None)
          b = lambda d: base64.urlsafe_b64encode(d).rstrip(b'=')
          h = b(json.dumps({'alg': 'ES256', 'kid': os.environ['KID'], 'typ': 'JWT'}).encode())
          n = int(time.time())
          p = b(json.dumps({'iss': os.environ['ISS'], 'iat': n, 'exp': n + 600, 'aud': 'appstoreconnect-v1'}).encode())
          r, s = utils.decode_dss_signature(key.sign(h + b'.' + p, ec.ECDSA(hashes.SHA256())))
          tok = (h + b'.' + p + b'.' + b(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))).decode()
          req = urllib.request.Request('https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.tefsirhadis.kutuphane', headers={'Authorization': 'Bearer ' + tok})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          print('APPID=' + d['data'][0]['id'])
          PY
      - name: Arşiv ve TestFlight
        working-directory: src/ios
        env:
          KID: ${{ secrets.APPLE_API_KEY_ID }}
          ISS: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -eo pipefail
          UP=$(python3 -c 'import json;print(json.load(open("../../ayar.json"))["yukle"])'); V=$(python3 -c 'import json;print(json.load(open("../../ayar.json"))["surum"])')
          [ "$UP" = 1 ] || { echo "yükleme istenmedi"; exit 0; }
          B=$((1000 + ${{ github.run_number }}))
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/apikey/AuthKey.p8 -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"
          xcodebuild -project TefsirHadis.xcodeproj -scheme TefsirHadis -configuration Release -destination 'generic/platform=iOS' -archivePath build/TH.xcarchive \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$B" TEFSIR_MAGAZA="https://apps.apple.com/app/id$APPID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -20
          cat > eo.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>CTF27B4QB9</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/TH.xcarchive -exportOptionsPlist eo.plist -exportPath build/out $AUTH | tail -20
          echo "YUKLENDI surum=$V yapi=$B"
      - name: Simülatör derlemesi ve ekran görüntüleri
        if: always()
        continue-on-error: true
        working-directory: src/ios
        run: |
          set -eo pipefail
          EKRAN=$(python3 -c 'import json;print(json.load(open("../../ayar.json"))["ekran"])')
          xcodebuild -project TefsirHadis.xcodeproj -scheme TefsirHadis -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build | tail -5
          [ "$EKRAN" = 1 ] || exit 0
          APP=build/sim/Build/Products/Debug-iphonesimulator/TefsirHadis.app
          # the data packs of the release, put where the app keeps them (as if downloaded)
          mkdir -p ../../veri && cd ../../veri
          curl -sSfL -o surum.json https://raw.githubusercontent.com/fehimdaduk2/tefsir-surum/main/surum.json
          python3 -c 'import json;[print(f["name"],f["url"]) for f in json.load(open("surum.json"))["veri"]["files"] if f["kind"]!="ses"]' | while read n u; do
            curl -sSfL --retry 3 -o "$n" "$u" || echo "yok: $n"
          done
          rm -f surum.json
          ls -la; cd ../src/ios
          mkdir -p ../../ekran/tr ../../ekran/en ../../ekran/ar
          shot() { # device, name, language, script
            xcrun simctl terminate "$1" com.tefsirhadis.kutuphane 2>/dev/null || true
            # the store's screenshots are not use: no counts from them (the variable goes to the app's process)
            SIMCTL_CHILD_TEFSIR_ISTATISTIK=0 xcrun simctl launch "$1" com.tefsirhadis.kutuphane -AppleLanguages "($3)" -AppleLocale "$3" -ekranjs "$4"
            sleep 20; xcrun simctl io "$1" screenshot "../../ekran/$2.png"
          }
          for dev in "iPhone 16 Pro Max" "iPad Pro 13-inch (M4)"; do
            UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name']=='$dev'))")
            xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            n=$(echo "$dev" | tr ' ()' '___')
            for L in tr en ar; do
              # a fresh install for each language: the first start follows the system's language
              xcrun simctl uninstall "$UDID" com.tefsirhadis.kutuphane 2>/dev/null || true
              xcrun simctl install "$UDID" "$APP"
              C=$(xcrun simctl get_app_container "$UDID" com.tefsirhadis.kutuphane data)
              P="$C/Library/Application Support/Tefsir/Library/Application Support/Tefsir ve Hadis Kutuphanesi"
              mkdir -p "$P" && cp ../../veri/*.zip "$P/"
              Q=rahmet; [ "$L" = tr ] || Q="رحمة"
              T="(window.tourEnd&&tourEnd())"
              shot "$UDID" "$L/$n-1-tefsir" $L "$T"
              shot "$UDID" "$L/$n-2-hadis" $L "$T;openHadisPanel()"
              shot "$UDID" "$L/$n-3-siyer" $L "$T;openSiyer().then(()=>setTimeout(()=>syEvent('hicret'),1500))"
              shot "$UDID" "$L/$n-4-oku" $L "$T;document.getElementById('btnRead').click()"
              shot "$UDID" "$L/$n-5-ara" $L "$T;openSearch();document.getElementById('sQ').value='$Q';document.getElementById('sForm').requestSubmit()"
            done
            xcrun simctl shutdown "$UDID" || true
          done
          ls -laR ../../ekran
      - name: Ekran görüntüleri dala
        if: always()
        run: |
          [ -d ekran ] && [ -n "$(ls ekran 2>/dev/null)" ] || exit 0
          git config user.email fehimdaduk2@users.noreply.github.com; git config user.name fehimdaduk2
          git checkout --orphan ios-ekran && git rm -rq --cached . && git add ekran && git commit -qm "iOS ekran görüntüleri" && git push -qf origin ios-ekran
