# Yayın: "yayin" dalına gönderilen dosyalardan GitHub Releases'ta bir sürüm oluşturur, sonra dalı siler.
# Dalda yayin.json ({"tag": "v4.30", "title": "...", "notes": "..."}) ve yayımlanacak dosyalar bulunur;
# 100 MB'tan büyük dosyalar parçalar hâlinde gelir (ad.part-aa, ad.part-ab …) ve burada birleştirilir.
# Mac paketleri önce bir Mac'te pencere alır ve imzalanır (mac/derle.sh).
# Etiket main'e bağlanır; böylece kurulum dosyaları deponun geçmişine girmez.
name: Yayın
on:
  push:
    branches: [yayin]
permissions:
  contents: write
jobs:
  # the macOS packages get their own window (mac/Pencere.m) and are signed as a whole, on a Mac (mac/derle.sh)
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yayin
      - name: Mac penceresi, imza, deneme
        run: bash mac/derle.sh dene
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Tefsir-Hadis-macOS-*.zip
  yayin:
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yayin
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: mac-imzali
      - name: İmzalı Mac paketleri
        run: |
          for a in arm64 amd64; do f=Tefsir-Hadis-macOS-$a.zip; cp mac-imzali/$f $f; cp mac-imzali/$f Guncelleme-$f; done
          rm -rf mac-imzali
      - name: Sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=$(jq -r .tag yayin.json)
          jq -r .title yayin.json > /tmp/baslik
          jq -r .notes yayin.json > /tmp/notlar
          # git takes no file over 100 MB: a larger one comes in parts (name.part-aa, -ab …) and is put together here
          shopt -s nullglob
          for f in *.part-aa; do b="${f%.part-aa}"; cat "$b".part-* > "$b"; rm -f "$b".part-*; done
          gh release delete "$TAG" --cleanup-tag -y || true
          FILES=$(find . -maxdepth 1 -type f ! -name yayin.json ! -name '.*' | sort)
          gh release create "$TAG" $FILES --target main --title "$(cat /tmp/baslik)" --notes-file /tmp/notlar --latest
  # the branch goes away whatever happened (a failed Mac step too)
  temizle:
    needs: [mac, yayin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yayin
      - name: Dalı sil
        run: git push origin --delete yayin
