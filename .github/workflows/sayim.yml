# İndirme sayıları → yönetim paneli: her saat sürümlerin indirilme sayılarını sayar ve GitHub'ın imzalı kimlik
# belgesiyle (OIDC) projenin sayacına gönderir; sayılar depoya ya da herkese açık bir dosyaya yazılmaz.
name: Sayım
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sayim.yml", "araclar/sayim.py"]
permissions:
  contents: read
  id-token: write
jobs:
  sayim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Say ve gönder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_VENDOR_NUMBER: ${{ secrets.APPLE_VENDOR_NUMBER }}
          GOOGLE_PLAY_ANAHTAR: ${{ secrets.GOOGLE_PLAY_ANAHTAR }}
          GOOGLE_PLAY_KOVA: ${{ secrets.GOOGLE_PLAY_KOVA }}
          MSSTORE_TENANT: ${{ secrets.MSSTORE_TENANT }}
          MSSTORE_CLIENT: ${{ secrets.MSSTORE_CLIENT }}
          MSSTORE_SECRET: ${{ secrets.MSSTORE_SECRET }}
        run: python3 araclar/sayim.py
